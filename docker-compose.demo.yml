# Local demo: fake Eureka, Spring/Gateway metrics and excluded instances.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
services:
  prometheus:
    extra_hosts: !reset []
  fake-services:
    image: node:22-slim
    command: ["node", "/app/fake-services.mjs"]
    volumes:
      - ./dev:/app:ro
    networks:
      monitoring:
        aliases: [eureka]
