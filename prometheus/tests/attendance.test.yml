      - eval_time: '20m'
        alertname: 'AttendanceScanHigh5xxRate'
        exp_alerts: []
      - eval_time: '20m'
        alertname: 'AttendanceScanHighLatency'
        exp_alerts: []
      - eval_time: '20m'
        alertname: 'AttendanceDownstreamFailures'
        exp_alerts: []
      - eval_time: '20m'
        alertname: 'AttendanceGuardLockContention'
        exp_alerts: []
      - eval_time: '20m'
        alertname: 'AttendanceQrPendingLong'
