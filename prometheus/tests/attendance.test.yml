      - series: 'attendance_downstream_calls_seconds_count{service="expo-attention-server",exported_service="user",outcome="failure"}'
        values: '0+1.5x100'
      - series: 'attendance_downstream_calls_seconds_count{service="expo-attention-server",exported_service="expo",outcome="failure"}'
        values: '0+1.5x100'
      - series: 'attendance_downstream_calls_seconds_count{service="expo-attention-server",exported_service="application",outcome="failure"}'
        values: '0+1.5x100'
