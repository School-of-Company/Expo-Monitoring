rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml

evaluation_interval: 15s

tests:
  # 10 req/s with 10% 5xx for 8 minutes: recording rules match, ServiceHigh5xxRate fires.
  - interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{service="expo-form-server",instance="a",status="200"}'
        values: '0+135x40'
      - series: 'http_server_requests_seconds_count{service="expo-form-server",instance="a",status="500"}'
        values: '0+15x40'
    promql_expr_test:
      - expr: service:http_requests:rate1m{service="expo-form-server"}
        eval_time: 5m
        exp_samples:
          - labels: 'service:http_requests:rate1m{service="expo-form-server"}'
            value: 10
      - expr: service:http_errors_5xx:ratio1m{service="expo-form-server"}
        eval_time: 5m
        exp_samples:
          - labels: 'service:http_errors_5xx:ratio1m{service="expo-form-server"}'
            value: 0.1
    alert_rule_test:
      - eval_time: 3m
        alertname: ServiceHigh5xxRate
        exp_alerts: []
      - eval_time: 8m
        alertname: ServiceHigh5xxRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: expo-form-server
            exp_annotations:
              summary: "expo-form-server: more than 5% of responses are 5xx"
              description: The 5xx ratio has been above 5% for 5 minutes.

  # Same error ratio at 0.05 req/s is below the traffic floor: no alert.
  - interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{service="quiet",instance="a",status="200"}'
        values: '0+0.675x40'
      - series: 'http_server_requests_seconds_count{service="quiet",instance="a",status="500"}'
        values: '0+0.075x40'
      - series: 'gateway_http_requests_total{service="quiet-gateway",app="quiet",status="200"}'
        values: '0+0.525x40'
      - series: 'gateway_http_requests_total{service="quiet-gateway",app="quiet",status="502"}'
        values: '0+0.225x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: ServiceHigh5xxRate
        exp_alerts: []
      - eval_time: 8m
        alertname: GatewayUpstream502Rate
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_bucket{service="spring",le="0.5"}'
        values: '0+135x40'
      - series: 'http_server_requests_seconds_bucket{service="spring",le="1"}'
        values: '0+150x40'
      - series: 'http_server_requests_seconds_bucket{service="spring",le="+Inf"}'
        values: '0+150x40'
      - series: 'gateway_http_request_duration_seconds_bucket{service="expo-gateway",le="0.5"}'
        values: '0+135x40'
      - series: 'gateway_http_request_duration_seconds_bucket{service="expo-gateway",le="1"}'
        values: '0+150x40'
      - series: 'gateway_http_request_duration_seconds_bucket{service="expo-gateway",le="+Inf"}'
        values: '0+150x40'
    promql_expr_test:
      - expr: service:http_latency_p95:5m
        eval_time: 5m
        exp_samples:
          - labels: 'service:http_latency_p95:5m{service="spring"}'
            value: 0.75
          - labels: 'service:http_latency_p95:5m{service="expo-gateway"}'
            value: 0.75

  # Gateway series map onto the same record names.
  - interval: 15s
    input_series:
      - series: 'gateway_http_requests_total{service="expo-gateway",status="200",app="x"}'
        values: '0+30x40'
    promql_expr_test:
      - expr: service:http_requests:rate1m{service="expo-gateway"}
        eval_time: 5m
        exp_samples:
          - labels: 'service:http_requests:rate1m{service="expo-gateway"}'
            value: 2
      - expr: service:http_errors_5xx:ratio1m{service="expo-gateway"}
        eval_time: 5m
        exp_samples:
          - labels: 'service:http_errors_5xx:ratio1m{service="expo-gateway"}'
            value: 0

  # Missing 5xx series and idle counters must both produce zero, never NaN.
  - interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{service="healthy",status="200"}'
        values: '0+30x40'
      - series: 'http_server_requests_seconds_count{service="idle",status="200"}'
        values: '0x40'
      - series: 'http_server_requests_seconds_count{service="idle",status="500"}'
        values: '0x40'
      - series: 'gateway_http_requests_total{service="idle-gateway",status="200"}'
        values: '0x40'
    promql_expr_test:
      - expr: service:http_errors_5xx:ratio1m
        eval_time: 5m
        exp_samples:
          - labels: 'service:http_errors_5xx:ratio1m{service="healthy"}'
            value: 0
          - labels: 'service:http_errors_5xx:ratio1m{service="idle"}'
            value: 0
          - labels: 'service:http_errors_5xx:ratio1m{service="idle-gateway"}'
            value: 0
    alert_rule_test:
      - eval_time: 8m
        alertname: ServiceHigh5xxRate
        exp_alerts: []

  # Gateway alerts still fire independently of the common RED mapping.
  - interval: 15s
    input_series:
      - series: 'gateway_http_requests_total{service="expo-gateway",status="200",app="demo"}'
        values: '0+105x40'
      - series: 'gateway_http_requests_total{service="expo-gateway",status="502",app="demo"}'
        values: '0+45x40'
      - series: 'gateway_upstream_healthy_instances{service="expo-gateway",app="demo"}'
        values: '0x40'
      - series: 'gateway_upstream_poll_failures_total{service="expo-gateway",app="demo"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: GatewayUpstream502Rate
        exp_alerts:
          - exp_labels:
              severity: critical
              app: demo
            exp_annotations:
              summary: "demo: more than 20% of requests fail with 502"
              description: "Requests routed to demo are failing at the connection level. If gateway_upstream_healthy_instances is still above 0, Eureka has not noticed yet (lease not expired)."
      - eval_time: 8m
        alertname: GatewayNoHealthyInstances
        exp_alerts:
          - exp_labels:
              severity: critical
              app: demo
              service: expo-gateway
            exp_annotations:
              summary: "demo: Eureka reports no UP instance"
              description: "This is Eureka's view, not proof of reachability - a crashed instance stays UP until its lease expires."
      - eval_time: 8m
        alertname: GatewayEurekaPollFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              app: demo
              service: expo-gateway
            exp_annotations:
              summary: "Background Eureka poll failing for demo"
              description: gateway_upstream_healthy_instances is dropped while polls fail, so it is not reporting.

  # An empty scrape must not create a fabricated service or alert.
  - interval: 15s
    promql_expr_test:
      - expr: service:http_errors_5xx:ratio1m
        eval_time: 5m
        exp_samples: []
    alert_rule_test:
      - eval_time: 8m
        alertname: ServiceHigh5xxRate
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{job="eureka-services",service="expo-form-server",instance="a"}'
        values: '1x12 0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 5m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: eureka-services
              service: expo-form-server
              instance: a
            exp_annotations:
              summary: "expo-form-server a: metrics endpoint not scrapable"
              description: >-
                Eureka still lists this instance but Prometheus cannot scrape it.
                Once Eureka evicts a crashed instance the target disappears and this
                alert resolves, so it is not a long-term record of the outage.
