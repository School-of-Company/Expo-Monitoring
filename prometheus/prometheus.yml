global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# No Alertmanager yet: alerts are visible in the Prometheus UI (Alerts tab).
scrape_configs:
  - job_name: eureka-services
    eureka_sd_configs:
      - server: http://eureka:8761/eureka
        refresh_interval: 30s
    relabel_configs:
      # Opt-in: only instances that set the metadata are scraped.
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_scrape]
        regex: "true"
        action: keep
      # The metrics port is separate from the service port, so it must be explicit.
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_port]
        regex: '\d+'
        action: keep
      - source_labels:
          - __meta_eureka_app_instance_ip_addr
          - __meta_eureka_app_instance_metadata_prometheus_port
        regex: '(.+);(\d+)'
        replacement: '$1:$2'
        target_label: __address__
      # Default /metrics when the metadata has no path.
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_path]
        regex: '(.+)'
        target_label: __metrics_path__
      - source_labels: [__meta_eureka_app_name]
        action: lowercase
        target_label: service
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance
