name: expo-monitoring

# Shared Prometheus + Grafana for the Expo MSA. Targets are discovered from
# Eureka (prometheus.yml), so adding a service or an instance needs no change here.
# Everything is published on loopback only - reach the UIs with an SSH tunnel.
# Loki, Alloy and the image renderer have no published ports; Tempo's OTLP
# receivers are published on 127.0.0.1 so same-host PM2 services can send spans.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # prometheus.yml queries http://eureka:8761. Point that name at your Eureka
    # host (EUREKA_HOST in .env). host-gateway = Eureka runs on the Docker host.
    extra_hosts:
      - "eureka:${EUREKA_HOST:-host-gateway}"
    networks:
      monitoring:
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
      - loki
      - tempo
      - renderer
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Base of the dashboard/panel/silence links in alert messages (SSH-tunnel address by default).
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3001}
      # Discord webhook for the provisioned contact point (never commit the value).
      # The fallback keeps Grafana starting when it is unset; notifications then fail.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-http://127.0.0.1:9/discord-webhook-not-configured}
      # Panel images in alert notifications (rendered by the renderer service).
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE: "true"
      # Dashboard snapshots stay on this Grafana (never published to snapshots.raintank.io).
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      monitoring:
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    environment:
      ENABLE_METRICS: "false"
    networks:
      monitoring:
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      monitoring:
    restart: unless-stopped

  # Tails PM2 log files from the host (LOG_DIR) and ships them to Loki.
  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${LOG_DIR:-./logs}:/var/log/expo:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      monitoring:
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo/tempo.yml
      - -config.expand-env=true
    environment:
      TEMPO_RETENTION_PERIOD: ${TEMPO_RETENTION_PERIOD:-168h}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      monitoring:
    restart: unless-stopped

networks:
  monitoring: {}

volumes:
  loki-data:
  tempo-data:
  alloy-data:
  prometheus-data:
  grafana-data:
