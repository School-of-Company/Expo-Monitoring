# Single-binary Loki, filesystem storage. Started with -config.expand-env=true.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  # Label cardinality guard: the collector only emits job, service and level.
  max_label_names_per_series: 8
  # module and filename travel as structured metadata (docs/logging.md).
  allow_structured_metadata: true
  # Loki would add service_name / detected_level on its own; keep labels fixed.
  discover_service_name: []
  discover_log_levels: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false
