name: Validate monitoring

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAFANA_ADMIN_PASSWORD: local-demo-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test digest
        run: |
          node --test digest/
          node dev/verify-digest.mjs
      - name: Validate Prometheus configuration and rules
        run: bash dev/validate-prometheus.sh
      - name: Verify discovery, RED records and dashboard queries
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
          docker compose -f docker-compose.yml -f docker-compose.demo.yml exec -T -e GRAFANA_ADMIN_PASSWORD fake-services node /app/verify-demo.mjs
      - name: Demo logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail 80
      - name: Stop demo
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down
