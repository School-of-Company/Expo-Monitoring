apiVersion: 1

# Discord only. The webhook comes from the environment; never write it here.
contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord-expo
        type: discord
        disableResolveMessage: false
        settings:
          url: $__env{DISCORD_WEBHOOK_URL}
          title: '{{ template "expo.title" . }}'
          message: '{{ template "expo.message" . }}'
          use_discord_username: false
