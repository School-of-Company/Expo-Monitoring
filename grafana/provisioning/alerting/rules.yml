apiVersion: 1

# Grafana-managed rules, only for alerts that should carry a panel image.
# prometheus/rules/ stays the source for the Prometheus UI alerts (issue #15, option b).
# __dashboardUid__/__panelId__ make Grafana screenshot the panel when it fires.
groups:
  - orgId: 1
    name: expo-grafana-alerts
    folder: Expo
    interval: 1m
    rules:
      - uid: grafana-service-5xx
        title: ServiceHigh5xxRate
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "5xx 응답 비율이 5%를 넘었습니다 (5분 지속, 요청률 0.1 req/s 이상)"
          runbook_url: https://github.com/School-of-Company/Expo-Monitoring/blob/main/docs/runbooks.md#servicehigh5xxrate
          __dashboardUid__: msa-overview
          __panelId__: "8"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: service:http_errors_5xx:ratio1m and on (service) (service:http_requests:rate1m > 0.1)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}

      - uid: grafana-form-outbox-stalled
        title: FormOutboxStalled
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "아웃박스 가장 오래된 미발행 건이 300초를 넘었습니다 (값 단위: 초)"
          runbook_url: https://github.com/School-of-Company/Expo-Monitoring/blob/main/docs/runbooks.md#formoutboxstalled
          __dashboardUid__: expo-form
          __panelId__: "1"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (service, outbox) (form_outbox_oldest_pending_age_seconds)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [300]}

      - uid: grafana-form-db-pool
        title: FormDbPoolExhausted
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "DB 연결 풀에서 대기 중인 요청이 5분 넘게 있습니다 (값: 대기 수)"
          runbook_url: https://github.com/School-of-Company/Expo-Monitoring/blob/main/docs/runbooks.md#formdbpoolexhausted
          __dashboardUid__: expo-form
          __panelId__: "2"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: min by (service) (form_db_pool_connections{state="waiting"})
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}

  # Consumers of expo.expo.changed (issue #36). Metrics come from Alloy's Kafka exporter (job "kafka").
  # Groups and topics exist only after a service enables KAFKA_EXPO_PROJECTION_ENABLED, hence noData OK.
  # No Prometheus twin in prometheus/rules/ (like FormOutboxStalled): Discord gets each alert once.
  # service = the consumer group (expo-<name>-server.expo-changed), copied with label_join: label_replace
  # would need "$1", and Grafana expands $ in provisioning files.
  - orgId: 1
    name: expo-kafka-consumers
    folder: Expo
    interval: 1m
    rules:
      - uid: grafana-expo-changed-lag
        title: ExpoChangedConsumerLag
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "박람회 변경 이벤트(expo.expo.changed) lag이 2분 넘게 0보다 큽니다 (값: 남은 메시지 수)"
          runbook_url: https://github.com/School-of-Company/Expo-Monitoring/blob/main/docs/runbooks.md#expochangedconsumerlag
          __dashboardUid__: expo-kafka
          __panelId__: "2"
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: label_join(sum by (consumergroup) (kafka_consumergroup_uncommitted_offsets{topic="expo.expo.changed"}), "service", "", "consumergroup")
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: grafana-expo-changed-dead-letter
        title: ExpoChangedDeadLetter
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "박람회 변경 이벤트가 DLT/DLQ로 넘어갔습니다 (값: 최근 10분 유입 수)"
          runbook_url: https://github.com/School-of-Company/Expo-Monitoring/blob/main/docs/runbooks.md#expochangeddeadletter
          __dashboardUid__: expo-kafka
          __panelId__: "4"
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Notification writes .dlq, the other consumers .dlt.
              expr: sum by (topic) (increase(kafka_topic_partition_current_offset{topic=~"expo[.]expo[.]changed[.](dlt|dlq)"}[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: grafana-expo-changed-stalled
        title: ExpoChangedConsumerStalled
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "박람회 변경 이벤트 lag이 남았는데 커밋 오프셋이 5분간 그대로입니다. 소비 정지 의심 (값: lag)"
          runbook_url: https://github.com/School-of-Company/Expo-Monitoring/blob/main/docs/runbooks.md#expochangedconsumerstalled
          __dashboardUid__: expo-kafka
          __panelId__: "6"
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: label_join((sum by (consumergroup) (kafka_consumergroup_uncommitted_offsets{topic="expo.expo.changed"}) > 0) and on (consumergroup) (sum by (consumergroup) (changes(kafka_consumergroup_current_offset{topic="expo.expo.changed"}[5m])) == 0), "service", "", "consumergroup")
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, settings: {mode: dropNN}}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
