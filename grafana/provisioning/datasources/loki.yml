apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # "... trace=<32 hex>" in the message, or a JSON "traceId" key -> link to the trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: '(?:trace=|"traceId":")([0-9a-f]{32})'
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
          datasourceUid: tempo
